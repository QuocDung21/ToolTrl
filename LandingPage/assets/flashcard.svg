<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img"
     aria-label="Minh hoạ: thẻ flashcard ôn tập công thức ngữ pháp với hai lựa chọn đã nhớ hoặc chưa nhớ">
  <defs>
    <linearGradient id="fcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4EFE7"/>
      <stop offset="100%" stop-color="#E6DED0"/>
    </linearGradient>
    <filter id="fcShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#2A2318" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="720" height="480" rx="24" fill="url(#fcBg)"/>

  <!-- Back cards -->
  <rect x="96" y="96" width="528" height="300" rx="20" fill="#FFFFFF" opacity=".45" transform="rotate(-4 360 246)"/>
  <rect x="96" y="96" width="528" height="300" rx="20" fill="#FFFFFF" opacity=".7" transform="rotate(-2 360 246)"/>

  <!-- Front card -->
  <g filter="url(#fcShadow)">
    <rect x="96" y="96" width="528" height="300" rx="20" fill="#FFFFFF"/>
  </g>

  <rect x="124" y="124" width="148" height="24" rx="8" fill="#EFF4FD"/>
  <text x="198" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#2F6FE4" text-anchor="middle">CẤU TRÚC NGỮ PHÁP</text>
  <text x="600" y="141" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#A9A296" text-anchor="end">7 / 24</text>

  <text x="360" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#232019" text-anchor="middle">Quá khứ hoàn thành</text>

  <rect x="152" y="224" width="416" height="62" rx="12" fill="#EFF4FD"/>
  <text x="360" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#2F6FE4" text-anchor="middle">S + had + V3/ed</text>
  <text x="360" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#2F6FE4" text-anchor="middle">+ by the time + S + V2/ed</text>

  <text x="360" y="320" font-family="ui-serif, 'Iowan Old Style', Georgia, serif" font-size="15" font-style="italic" fill="#4A443B" text-anchor="middle">He had left before I arrived.</text>
  <text x="360" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#8A8478" text-anchor="middle">Anh ấy đã rời đi trước khi tôi đến.</text>

  <line x1="124" y1="366" x2="596" y2="366" stroke="#EFEBE4"/>

  <text x="360" y="404" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#A9A296" text-anchor="middle">Nhấn Space để lật thẻ · ⌘S lưu vào sổ tay</text>

  <!-- Rating buttons -->
  <rect x="152" y="428" width="180" height="40" rx="12" fill="#F7F3EC" stroke="#E9E3D8"/>
  <text x="242" y="453" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6B6558" text-anchor="middle">Chưa nhớ</text>
  <rect x="388" y="428" width="180" height="40" rx="12" fill="#14161A"/>
  <text x="478" y="453" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#EEF1F6" text-anchor="middle">Đã nhớ</text>

  <!-- Progress -->
  <rect x="96" y="72" width="528" height="6" rx="3" fill="#FFFFFF" opacity=".6"/>
  <rect x="96" y="72" width="154" height="6" rx="3" fill="#2F6FE4"/>
</svg>
