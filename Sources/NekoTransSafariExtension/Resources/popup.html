<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NekoTrans</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <!-- Header -->
        <header class="header">
            <div class="brand">
                <img src="images/icon-32.png" class="brand-logo" alt="NekoTrans">
                <div class="brand-text">
                    <span class="brand-title">NekoTrans</span>
                    <span class="brand-subtitle">Trình dịch Web Safari</span>
                </div>
            </div>
            <div id="statusBadge" class="status-badge" title="Đang kiểm tra kết nối với NekoTrans App...">
                <span class="status-dot"></span>
                <span id="statusText" class="status-text">Đang kết nối...</span>
            </div>
        </header>

        <!-- Language Selector -->
        <div class="lang-card">
            <div class="lang-picker">
                <select id="sourceLang" class="lang-select">
                    <option value="auto">🌐 Tự phát hiện</option>
                    <option value="en">🇬🇧 Tiếng Anh</option>
                    <option value="vi">🇻🇳 Tiếng Việt</option>
                    <option value="ja">🇯🇵 Tiếng Nhật</option>
                    <option value="zh-CN">🇨🇳 Tiếng Trung</option>
                    <option value="ko">🇰🇷 Tiếng Hàn</option>
                    <option value="fr">🇫🇷 Tiếng Pháp</option>
                    <option value="de">🇩🇪 Tiếng Đức</option>
                    <option value="es">🇪🇸 Tiếng TBN</option>
                    <option value="ru">🇷🇺 Tiếng Nga</option>
                </select>
                <div class="select-chevron">
                    <svg width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
            </div>

            <button id="btnSwapLang" class="btn-swap" title="Hoán đổi ngôn ngữ">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 16V4M7 4L3 8M7 4L11 8M17 8V20M17 20L21 16M17 20L13 16"/>
                </svg>
            </button>

            <div class="lang-picker">
                <select id="targetLang" class="lang-select">
                    <option value="vi" selected>🇻🇳 Tiếng Việt</option>
                    <option value="en">🇬🇧 Tiếng Anh</option>
                    <option value="ja">🇯🇵 Tiếng Nhật</option>
                    <option value="zh-CN">🇨🇳 Tiếng Trung</option>
                    <option value="ko">🇰🇷 Tiếng Hàn</option>
                    <option value="fr">🇫🇷 Tiếng Pháp</option>
                    <option value="de">🇩🇪 Tiếng Đức</option>
                    <option value="es">🇪🇸 Tiếng TBN</option>
                    <option value="ru">🇷🇺 Tiếng Nga</option>
                </select>
                <div class="select-chevron">
                    <svg width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
            </div>
        </div>

        <!-- Mode Segmented Control -->
        <div class="mode-row">
            <span class="mode-label">Chế độ hiển thị:</span>
            <div class="segmented-control" role="tablist">
                <button class="segment active" data-mode="bilingual" role="tab" type="button">
                    <span>Song ngữ</span>
                </button>
                <button class="segment" data-mode="replace" role="tab" type="button">
                    <span>Thay thế</span>
                </button>
            </div>
        </div>

        <!-- Main Action Buttons -->
        <div class="page-actions">
            <button id="btnTranslatePage" class="btn btn-primary" type="button">
                <span class="btn-icon">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>
                </span>
                <span id="btnTranslateLabel">Dịch song ngữ trang web</span>
            </button>
            <button id="btnRestorePage" class="btn btn-secondary" type="button" style="display: none;">
                <span class="btn-icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                </span>
                <span>Khôi phục trang gốc</span>
            </button>
        </div>

        <!-- Quick Translate Section -->
        <div class="quick-translate">
            <div class="quick-input-box">
                <textarea id="quickInput" placeholder="Nhập từ hoặc câu để dịch nhanh..." rows="2"></textarea>
                <button id="btnQuickTranslate" class="btn-quick-send" title="Dịch nhanh (Enter)" type="button">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>
            <div id="quickResult" class="quick-result" style="display: none;">
                <div id="quickResultText" class="result-text"></div>
                <div class="result-actions">
                    <button id="btnCopyQuick" class="btn-mini" title="Sao chép" type="button">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                    <button id="btnSpeakQuick" class="btn-mini" title="Phát âm" type="button">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                    </button>
                    <button id="btnOpenAppQuick" class="btn-mini" title="Mở trong NekoTrans" type="button">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Settings Group -->
        <div class="settings-group">
            <label class="toggle-row">
                <span class="toggle-label">Hiện nút dịch khi bôi đen</span>
                <input type="checkbox" id="toggleBubble" checked>
                <span class="toggle-switch"></span>
            </label>
            <div class="settings-separator"></div>
            <label class="toggle-row">
                <span class="toggle-label">Tự động phát âm khi tra từ</span>
                <input type="checkbox" id="toggleAutoSpeak">
                <span class="toggle-switch"></span>
            </label>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <button id="btnOpenApp" class="btn-open-app" type="button">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                <span>Mở ứng dụng NekoTrans</span>
            </button>
            <span class="version">v1.0</span>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
