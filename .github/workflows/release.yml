name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-dmg:
    name: Build & Publish DMG Release (macOS 15)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode toolchain
        run: |
          source ./Scripts/toolchain.sh
          xcodebuild -version

      - name: Run NekoKit & Xcode Tests
        run: |
          swift test --package-path Packages/NekoKit
          make test

      - name: Build NekoTrans DMG & Chrome Extension
        run: |
          make dmg
          make chrome

      - name: Generate SHA-256 Checksums
        run: |
          shasum -a 256 build/*.dmg build/*.zip > build/SHA256SUMS.txt 2>/dev/null || shasum -a 256 build/*.dmg > build/SHA256SUMS.txt
          cat build/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/*.dmg
            build/*.zip
            build/SHA256SUMS.txt
